[package]
authors = ["Siavash Eliasi"]
name = "llm-provider-sync"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Manage OpenAI-compatible model providers and sync their models into AI agent configs"
repository = "https://github.com/siavashserver/llm-provider-sync.git"

[package.metadata.wix]
upgrade-guid = "A626C6F9-6234-49F9-BFDB-0CA294781766"
path-guid = "260DCDC9-EEAD-4B8D-8631-848F317429B4"
license = false
eula = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cliclack = "0.5"
console = "0.16"
directories = "6"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
# Blocking client: the CLI is strictly sequential, so no async runtime is needed.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
