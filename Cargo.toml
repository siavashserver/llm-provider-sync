[package]
name = "llm-provider-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Manage OpenAI-compatible model providers and sync their models into AI agent configs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
cliclack = "0.5"
console = "0.16"
directories = "6"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
# Blocking client: the CLI is strictly sequential, so no async runtime is needed.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
thiserror = "2"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
